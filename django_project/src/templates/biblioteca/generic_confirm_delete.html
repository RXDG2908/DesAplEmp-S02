{% extends 'base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<h2>Confirmar eliminación</h2>

<p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no
se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{{ view.success_url }}">Cancelar</a>
</form>
{% endblock %}
