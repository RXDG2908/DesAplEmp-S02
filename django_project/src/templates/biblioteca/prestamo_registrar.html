{% extends 'base.html' %}

{% block title %}Registrar préstamo{% endblock %}

{% block content %}
<h2>Registrar préstamo</h2>

{% if error %}
<p class="errorlist">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar préstamo</button>
    <a href="{% url 'biblioteca:prestamo_list' %}">Cancelar</a>
</form>
{% endblock %}
