{% extends 'base.html' %}

{% block title %}Nueva cita{% endblock %}

{% block content %}
<h2>Registrar nueva cita</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar cita</button>
    <a href="{% url 'vet:cita_list' %}">Cancelar</a>
</form>

<p>
    La cita se guarda en la base de datos SQLite, por lo que se mantiene
    aunque se reinicie el servidor.
</p>
{% endblock %}
