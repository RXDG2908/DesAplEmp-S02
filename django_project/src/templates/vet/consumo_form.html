{% extends 'base.html' %}

{% block title %}Registrar consumo{% endblock %}

{% block content %}
<h2>Registrar consumo de insumo</h2>

{% if error %}
<p class="errorlist">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar consumo</button>
    <a href="{% url 'vet:cita_list' %}">Cancelar</a>
</form>
{% endblock %}
