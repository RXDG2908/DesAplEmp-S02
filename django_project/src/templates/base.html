<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Veterinaria{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Reserva de citas — Veterinaria</h1>
        <nav>
            <a href="{% url 'vet:cita_list' %}">Citas</a>
            <a href="{% url 'vet:cita_crear' %}">Nueva cita</a>
        </nav>
    </header>

    <main>
        {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Desarrollo de Aplicaciones Empresariales &middot; Laboratorio 02</p>
    </footer>
</body>
</html>
